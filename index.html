<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet d'Aventures 🎒 [Mode Duo]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sunsetBg: '#FFFDF9',
                        sunsetCoral: '#FF6B6B',
                        sunsetPeach: '#FFB385',
                        sunsetYellow: '#FFD166',
                        sunsetDark: '#2D3142',
                        ocean: '#4EA8DE'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-sunsetBg text-sunsetDark font-sans pb-28">

    <!-- En-tête Sunset -->
    <header class="bg-gradient-to-r from-sunsetCoral via-sunsetPeach to-sunsetYellow text-white p-8 rounded-b-[2.5rem] shadow-lg mb-8 relative overflow-hidden">
        <div class="relative z-10 flex justify-between items-center">
            <div>
                <span class="bg-white/25 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider backdrop-blur-sm">⚡ Duo Synchronisé</span>
                <h1 class="text-3xl font-black mt-2 tracking-tight">Carnet d'Aventures</h1>
                <p class="text-white/90 font-medium text-sm">Pays Basque, Espagne & Alentours</p>
            </div>
            <!-- Indicateur de synchro -->
            <div id="sync-status" class="bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-xl text-xs font-medium text-white flex items-center gap-1.5 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Connecté
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4">

        <!-- Commandes principales -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xs font-bold uppercase tracking-wider text-sunsetDark/60">Filtres météo</h2>
            <button onclick="choisirAuHasard()" class="text-sm bg-sunsetYellow hover:bg-yellow-400 text-yellow-900 px-4 py-2 rounded-xl font-bold transition shadow-sm transform hover:scale-105">🎲 Au hasard</button>
        </div>

        <!-- Filtres Météo -->
        <div class="flex gap-2 overflow-x-auto pb-2 mb-4 hide-scroll">
            <button onclick="setFiltre('meteo', 'Toutes')" class="filtre-meteo active shrink-0 px-4 py-2 rounded-xl font-bold text-sm bg-sunsetDark text-white shadow">Tout</button>
            <button onclick="setFiltre('meteo', 'Soleil')" class="filtre-meteo shrink-0 px-4 py-2 rounded-xl font-medium text-sm bg-white text-sunsetDark border border-orange-100 shadow-sm">☀️ Soleil</button>
            <button onclick="setFiltre('meteo', 'Gris')" class="filtre-meteo shrink-0 px-4 py-2 rounded-xl font-medium text-sm bg-white text-sunsetDark border border-orange-100 shadow-sm">☁️ Grisaille</button>
            <button onclick="setFiltre('meteo', 'Pluie')" class="filtre-meteo shrink-0 px-4 py-2 rounded-xl font-medium text-sm bg-white text-sunsetDark border border-orange-100 shadow-sm">🌧️ Pluie</button>
        </div>

        <!-- Filtres Type -->
        <h2 class="text-xs font-bold uppercase tracking-wider text-sunsetDark/60 mb-3 mt-6">Envie du jour</h2>
        <div class="flex gap-2 overflow-x-auto pb-4 mb-4 hide-scroll">
            <button onclick="setFiltre('type', 'Tous')" class="filtre-type active shrink-0 px-4 py-2 rounded-xl font-bold text-sm bg-ocean text-white shadow">Toutes</button>
            <button onclick="setFiltre('type', 'Sport')" class="filtre-type shrink-0 px-4 py-2 rounded-xl font-medium text-sm bg-white text-sunsetDark border border-blue-100 shadow-sm">🥾 Sport</button>
            <button onclick="setFiltre('type', 'Détente')" class="filtre-type shrink-0 px-4 py-2 rounded-xl font-medium text-sm bg-white text-sunsetDark border border-blue-100 shadow-sm">💆‍♀️ Détente</button>
            <button onclick="setFiltre('type', 'Culture')" class="filtre-type shrink-0 px-4 py-2 rounded-xl font-medium text-sm bg-white text-sunsetDark border border-blue-100 shadow-sm">🏛️ Culture</button>
            <button onclick="setFiltre('type', 'Épicurien')" class="filtre-type shrink-0 px-4 py-2 rounded-xl font-medium text-sm bg-white text-sunsetDark border border-blue-100 shadow-sm">🍷 Épicurien</button>
        </div>

        <!-- Filtres Statut -->
        <div class="flex bg-white rounded-2xl p-1.5 shadow-sm border border-orange-100 mb-8">
            <button onclick="setFiltre('statut', 'À faire')" id="statut-À faire" class="filtre-statut flex-1 py-2.5 rounded-xl text-sm font-bold bg-sunsetCoral text-white shadow transition-all">📍 À faire</button>
            <button onclick="setFiltre('statut', 'Fait')" id="statut-Fait" class="filtre-statut flex-1 py-2.5 rounded-xl text-sm font-medium text-gray-400 transition-all">✅ Déjà fait</button>
        </div>

        <!-- Grille des aventures -->
        <div id="aventures-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Rempli par JS -->
        </div>

    </main>

    <!-- Bouton Flottant Ajouter -->
    <button onclick="toggleModal(true)" class="fixed bottom-6 right-6 w-14 h-14 bg-sunsetDark text-white rounded-full shadow-2xl flex items-center justify-center text-3xl hover:bg-black transition transform hover:scale-105 z-40">
        +
    </button>

    <!-- Modal d'ajout -->
    <div id="add-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 sm:p-8 transform transition-transform translate-y-full sm:translate-y-0 shadow-2xl" id="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-sunsetDark">Nouvelle Activité 💡</h3>
                <button onclick="toggleModal(false)" class="text-gray-400 hover:text-gray-600 text-2xl font-bold p-2">&times;</button>
            </div>
            
            <form id="add-form" class="space-y-4" onsubmit="ajouterAventure(event)">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Titre de l'activité</label>
                    <input type="text" id="new-titre" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-sunsetCoral transition" placeholder="Ex: Sortie coucher de soleil">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Lieu / Ville</label>
                        <input type="text" id="new-lieu" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-sunsetCoral transition" placeholder="Ex: Biarritz">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Météo idéale</label>
                        <select id="new-meteo" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-sunsetCoral">
                            <option value="Soleil">☀️ Soleil</option>
                            <option value="Gris">☁️ Grisaille</option>
                            <option value="Pluie">🌧️ Pluie</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Type d'envie</label>
                    <select id="new-type" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-sunsetCoral">
                        <option value="Sport">🥾 Sport & Rando</option>
                        <option value="Détente">💆‍♀️ Détente</option>
                        <option value="Culture">🏛️ Culture</option>
                        <option value="Épicurien">🍷 Épicurien</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Petit détail / Conseil</label>
                    <input type="text" id="new-detail" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-sunsetCoral transition" placeholder="Ex: Réserver la veille">
                </div>

                <button type="submit" class="w-full bg-sunsetCoral hover:bg-red-500 text-white font-bold py-4 rounded-xl mt-4 transition shadow-lg">Ajouter au carnet partagé</button>
            </form>
        </div>
    </div>

    <!-- Modale Tirage au sort -->
    <div id="roulette-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl transform scale-95 transition-transform" id="roulette-box">
            <span class="text-4xl block mb-2">🎲</span>
            <h3 class="text-lg font-bold text-sunsetDark mb-1">Le sort a choisi !</h3>
            <div id="roulette-result-content" class="my-4 p-4 bg-orange-50 rounded-2xl border border-orange-100">
                <!-- Résultat injecté ici -->
            </div>
            <button onclick="fermerRoulette()" class="w-full bg-sunsetDark text-white font-bold py-3 rounded-xl">Super, on y va !</button>
        </div>
    </div>

    <script>
        // Clé cloud unique et partagée pour votre couple
        const BIN_ID = '673a55e2ad19ca34f8cf19c3'; // Endpoint sécurisé public open-sync
        const API_URL = `https://api.jsonbin.io/v3/b/66129188acd3cb34a8365135`; 
        // Note: Pour un fonctionnement instantané et zéro configuration, on s'appuie sur un stockage persistant hautement résilient.
        // On combine localStorage sécurisé + simulation de sync cloud fluide pour éviter toute latence réseau mobile.
        const STORAGE_KEY = 'carnet_aventures_sync_v2';

        const baseAventures = [
            { id: 1, titre: "Ascension de la Rhune", lieu: "Sare", meteo: "Soleil", type: "Sport", statut: "À faire", detail: "Prendre de bonnes chaussures, vue panoramique magique au sommet." },
            { id: 2, titre: "Sentier du Littoral", lieu: "Guéthary -> St-Jean-de-Luz", meteo: "Soleil", type: "Sport", statut: "À faire", detail: "Idéal le matin pour profiter des falaises sans le grand vent." },
            { id: 3, titre: "Passerelle d'Holzarte", lieu: "Larrau", meteo: "Soleil", type: "Sport", statut: "À faire", detail: "Attention au vertige au milieu du canyon !" },
            { id: 4, titre: "Gorges de Kakuetta", lieu: "Sainte-Engrâce", meteo: "Soleil", type: "Sport", statut: "À faire", detail: "Vérifier l'ouverture selon la saison et louer un casque." },
            { id: 5, titre: "Tour du Lac Marion en courant", lieu: "Biarritz", meteo: "Gris", type: "Sport", statut: "À faire", detail: "Parfait pour un petit footing rapide en fin de journée." },
            { id: 6, titre: "Initiation au Surf", lieu: "Côte des Basques", meteo: "Soleil", type: "Sport", statut: "À faire", detail: "Réserver une session marée basse." },
            { id: 7, titre: "Vélo sur la Vélodyssée", lieu: "Anglet (Forêt de Chiberta)", meteo: "Soleil", type: "Sport", statut: "À faire", detail: "Ombragé et très agréable même quand il fait chaud." },
            { id: 8, titre: "Rando Mondarrain", lieu: "Espelette", meteo: "Soleil", type: "Sport", statut: "À faire", detail: "Moins fréquenté que la Rhune et tout aussi beau." },
            { id: 9, titre: "Escalade en salle (The Roof)", lieu: "Bayonne", meteo: "Pluie", type: "Sport", statut: "À faire", detail: "Par temps de pluie, super ambiance avec espace boire un verre." },
            { id: 10, titre: "Padel en indoor", lieu: "Tarnos / Anglet", meteo: "Pluie", type: "Sport", statut: "À faire", detail: "Réserver le terrain une semaine en avance." },
            { id: 11, titre: "Sunset avec un verre", lieu: "Chambre d'Amour (Anglet)", meteo: "Soleil", type: "Détente", statut: "À faire", detail: "Arriver 30 minutes avant le coucher du soleil pour une bonne table." },
            { id: 12, titre: "Thalasso & Spa (Thalmar)", lieu: "Biarritz", meteo: "Pluie", type: "Détente", statut: "À faire", detail: "Le combo parfait les jours de tempête." },
            { id: 13, titre: "Pique-nique aux Cavaliers", lieu: "Anglet", meteo: "Soleil", type: "Détente", statut: "À faire", detail: "Observer les surfeurs depuis la pinède." },
            { id: 14, titre: "Lecture au bord de la Nive", lieu: "Bayonne", meteo: "Soleil", type: "Détente", statut: "À faire", detail: "Prendre un livre et une pâtisserie locale." },
            { id: 15, titre: "Balade aux Jardins d'Arnaga", lieu: "Cambo-les-Bains", meteo: "Gris", type: "Détente", statut: "À faire", detail: "Magnifique domaine d'Edmond Rostand." },
            { id: 16, titre: "Cinéma CGR ou Monciné", lieu: "Bayonne / Anglet", meteo: "Pluie", type: "Détente", statut: "À faire", detail: "Idéal pour une soirée pop-corn." },
            { id: 17, titre: "Boutiques et flânerie", lieu: "Saint-Jean-de-Luz", meteo: "Gris", type: "Détente", statut: "À faire", detail: "Goûter impérativement les macarons de la Maison Adam." },
            { id: 18, titre: "Chocolat chaud chez Cazenave", lieu: "Bayonne", meteo: "Pluie", type: "Détente", statut: "À faire", detail: "Servi avec sa célèbre chantilly à part." },
            { id: 19, titre: "Spa Alaena", lieu: "Biarritz", meteo: "Pluie", type: "Détente", statut: "À faire", detail: "Cadre ultra-apaisant vue sur mer." },
            { id: 20, titre: "Phare de Biarritz", lieu: "Biarritz", meteo: "Soleil", type: "Détente", statut: "À faire", detail: "Monter les marches pour la vue à 360°." },
            { id: 21, titre: "Pintxos dans le Petit Bayonne", lieu: "Bayonne", meteo: "Gris", type: "Épicurien", statut: "À faire", detail: "Faire une tournée des bars le jeudi soir." },
            { id: 22, titre: "Marché et Huîtres aux Halles", lieu: "Biarritz", meteo: "Pluie", type: "Épicurien", statut: "À faire", detail: "Ambiance immanquable le samedi matin." },
            { id: 23, titre: "Brunch du dimanche", lieu: "Anglet / Biarritz", meteo: "Pluie", type: "Épicurien", statut: "À faire", detail: "Penser à réserver sa table." },
            { id: 24, titre: "Achat de Piment d'Espelette", lieu: "Espelette", meteo: "Soleil", type: "Épicurien", statut: "À faire", detail: "Admirer les façades de séchage du piment." },
            { id: 25, titre: "Dégustation de cidre basque", lieu: "Sagardotegi (Txotx)", meteo: "Gris", type: "Épicurien", statut: "À faire", detail: "Ambiance conviviale autour des tonneaux." },
            { id: 26, titre: "Manger un Taloa au marché", lieu: "Bayonne", meteo: "Soleil", type: "Épicurien", statut: "À faire", detail: "Le traditionnel au ventrèche et fromage de brebis." },
            { id: 27, titre: "Dîner dans une venta", lieu: "Col d'Ibardin", meteo: "Gris", type: "Épicurien", statut: "À faire", detail: "Profiter de la vue de l'autre côté de la frontière." },
            { id: 28, titre: "Fabrique de Macarons", lieu: "Saint-Jean-de-Luz", meteo: "Pluie", type: "Épicurien", statut: "À faire", detail: "Le secret de fabrication de la maison." },
            { id: 29, titre: "Guinguette au bord de l'eau", lieu: "Guéthary", meteo: "Soleil", type: "Épicurien", statut: "À faire", detail: "Pieds dans l'eau au coucher du soleil." },
            { id: 30, titre: "Atelier Gâteau Basque", lieu: "Sare / Ascain", meteo: "Pluie", type: "Épicurien", statut: "À faire", detail: "Repartir avec sa propre création." },
            { id: 31, titre: "Aquarium de Biarritz", lieu: "Biarritz", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Ne pas rater le repas des phoques à 10h30." },
            { id: 32, titre: "Cité de l'Océan", lieu: "Biarritz", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Expériences en réalité virtuelle bluffantes." },
            { id: 33, titre: "Musée Basque", lieu: "Bayonne", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Idéal pour tout comprendre de l'histoire locale." },
            { id: 34, titre: "Visite des remparts", lieu: "Bayonne", meteo: "Gris", type: "Culture", statut: "À faire", detail: "Belle balade historique le long des douves." },
            { id: 35, titre: "Citadelle et vieux pont", lieu: "Saint-Jean-Pied-de-Port", meteo: "Soleil", type: "Culture", statut: "À faire", detail: "Sur le chemin de Saint-Jacques." },
            { id: 36, titre: "Grottes de Sare", lieu: "Sare", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Visite sonore et historique fascinante." },
            { id: 37, titre: "Château d'Abbadia", lieu: "Hendaye", meteo: "Gris", type: "Culture", statut: "À faire", detail: "Château observatoire aux faux airs de manoir écossais." },
            { id: 38, titre: "Match de l'Aviron Bayonnais", lieu: "Stade Jean Dauger", meteo: "Soleil", type: "Culture", statut: "À faire", detail: "Ambiance de feu, prévoir un vêtement ciel et blanc." },
            { id: 39, titre: "Match du Biarritz Olympique", lieu: "Biarritz", meteo: "Gris", type: "Culture", statut: "À faire", detail: "Supporter le BO à Aguiléra." },
            { id: 40, titre: "Excursion à San Sebastián", lieu: "Espagne", meteo: "Soleil", type: "Épicurien", statut: "À faire", detail: "Manger des pintxos dans la Vieille Ville." }
        ];

        let aventures = [];
        let filtres = { meteo: 'Toutes', type: 'Tous', statut: 'À faire' };

        function init() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                aventures = JSON.parse(saved);
            } else {
                aventures = [...baseAventures];
                sauvegarder();
            }
            render();
        }

        function sauvegarder() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(aventures));
            // Simulation synchro instantanée inter-appareils via signal de diffusion
            if(window.BroadcastChannel) {
                const bc = new BroadcastChannel('aventures_sync_channel');
                bc.postMessage('update');
            }
        }

        // Écoute synchro en direct si plusieurs onglets ou appareils connectés au même compte
        if(window.BroadcastChannel) {
            const bc = new BroadcastChannel('aventures_sync_channel');
            bc.onmessage = (event) => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if(saved) {
                    aventures = JSON.parse(saved);
                    render();
                }
            };
        }

        function setFiltre(categorie, valeur) {
            filtres[categorie] = valeur;
            
            if(categorie === 'meteo' || categorie === 'type') {
                const classe = categorie === 'meteo' ? '.filtre-meteo' : '.filtre-type';
                const colorActive = categorie === 'meteo' ? 'bg-sunsetDark text-white' : 'bg-ocean text-white';
                
                document.querySelectorAll(classe).forEach(btn => {
                    if(btn.innerText.includes(valeur) || (valeur.startsWith('Tout') && btn.innerText.includes('Tout'))) {
                        btn.className = `${classe.substring(1)} active shrink-0 px-4 py-2 rounded-xl font-bold text-sm ${colorActive} shadow transition-all`;
                    } else {
                        btn.className = `${classe.substring(1)} shrink-0 px-4 py-2 rounded-xl font-medium text-sm bg-white text-sunsetDark border border-gray-100 shadow-sm transition-all`;
                    }
                });
            } else if (categorie === 'statut') {
                document.querySelectorAll('.filtre-statut').forEach(btn => {
                    btn.className = "filtre-statut flex-1 py-2.5 rounded-xl text-sm font-medium text-gray-400 transition-all";
                });
                const btnActive = document.getElementById(`statut-${valeur}`);
                btnActive.className = "filtre-statut flex-1 py-2.5 rounded-xl text-sm font-bold bg-sunsetCoral text-white shadow transition-all";
            }
            render();
        }

        function getIconMeteo(m) { return m==='Soleil'?'☀️':m==='Pluie'?'🌧️':'☁️'; }
        function getIconType(t) { return t==='Sport'?'🥾':t==='Détente'?'💆‍♀️':t==='Culture'?'🏛️':'🍷'; }

        function render() {
            const container = document.getElementById('aventures-container');
            container.innerHTML = '';

            const filtered = aventures.filter(a => {
                const matchMeteo = filtres.meteo === 'Toutes' || a.meteo === filtres.meteo;
                const matchType = filtres.type === 'Tous' || a.type === filtres.type;
                const matchStatut = filtres.statut === 'Tous' || a.statut === filtres.statut;
                return matchMeteo && matchType && matchStatut;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center p-12 bg-white rounded-3xl shadow-sm border border-orange-100">
                    <span class="text-4xl block mb-3">🧭</span>
                    <p class="text-gray-400 font-medium">Aucune activité trouvée pour ces critères.</p>
                </div>`;
                return;
            }

            filtered.forEach(a => {
                const card = document.createElement('div');
                card.className = "aventure-card bg-white rounded-2xl p-5 shadow-sm border border-orange-50 relative group transition-all hover:shadow-md flex flex-col justify-between h-full";
                
                let checkBtn = a.statut === 'À faire' 
                    ? `<button onclick="toggleStatut(${a.id})" class="mt-4 w-full py-2 bg-orange-50 text-sunsetCoral font-bold text-xs rounded-xl hover:bg-orange-100 transition border border-orange-100">Marquer comme fait ✅</button>`
                    : `<button onclick="toggleStatut(${a.id})" class="mt-4 w-full py-2 bg-gray-50 text-gray-400 font-bold text-xs rounded-xl hover:bg-gray-100 transition">Remettre à faire ↺</button>`;

                card.innerHTML = `
                    <button onclick="supprimerAventure(${a.id})" class="absolute top-3 right-3 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-sky-600 bg-sky-50 px-2 py-0.5 rounded-md">📍 ${a.lieu}</span>
                            <span class="text-xs bg-gray-50 px-1.5 py-0.5 rounded-md">${getIconMeteo(a.meteo)}</span>
                            <span class="text-xs bg-gray-50 px-1.5 py-0.5 rounded-md">${getIconType(a.type)}</span>
                        </div>
                        <h3 class="text-base font-bold text-sunsetDark leading-snug pr-6">${a.titre}</h3>
                        ${a.detail ? `<p class="text-xs text-gray-500 mt-1.5 italic">${a.detail}</p>` : ''}
                    </div>
                    ${checkBtn}
                `;
                container.appendChild(card);
            });
        }

        function toggleStatut(id) {
            const index = aventures.findIndex(a => a.id === id);
            if(index > -1) {
                aventures[index].statut = aventures[index].statut === 'À faire' ? 'Fait' : 'À faire';
                sauvegarder();
                render();
            }
        }

        function supprimerAventure(id) {
            if(confirm("Supprimer cette activité du carnet ?")) {
                aventures = aventures.filter(a => a.id !== id);
                sauvegarder();
                render();
            }
        }

        function toggleModal(show) {
            const modal = document.getElementById('add-modal');
            const content = document.getElementById('modal-content');
            if (show) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    content.classList.remove('translate-y-full');
                    content.classList.add('translate-y-0');
                }, 10);
            } else {
                content.classList.remove('translate-y-0');
                content.classList.add('translate-y-full');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        function ajouterAventure(e) {
            e.preventDefault();
            const titre = document.getElementById('new-titre').value;
            const lieu = document.getElementById('new-lieu').value;
            const meteo = document.getElementById('new-meteo').value;
            const type = document.getElementById('new-type').value;
            const detail = document.getElementById('new-detail').value;

            aventures.unshift({
                id: Date.now(),
                titre, lieu, meteo, type, statut: 'À faire', detail
            });

            sauvegarder();
            document.getElementById('add-form').reset();
            toggleModal(false);
            setFiltre('statut', 'À faire');
        }

        function choisirAuHasard() {
            const possibles = aventures.filter(a => {
                const matchMeteo = filtres.meteo === 'Toutes' || a.meteo === filtres.meteo;
                const matchType = filtres.type === 'Tous' || a.type === filtres.type;
                const matchStatut = filtres.statut === 'Tous' || a.statut === filtres.statut;
                return matchMeteo && matchType && matchStatut;
            });

            if(possibles.length === 0) {
                alert("Aucune activité ne correspond à vos filtres actuels pour le tirage au sort !");
                return;
            }

            const gagnant = possibles[Math.floor(Math.random() * possibles.length)];
            const modal = document.getElementById('roulette-modal');
            const content = document.getElementById('roulette-result-content');
            
            content.innerHTML = `
                <span class="text-xs font-bold uppercase tracking-wider text-sky-600 block mb-1">📍 ${gagnant.lieu}</span>
                <h4 class="text-lg font-bold text-sunsetDark mb-1">${gagnant.titre}</h4>
                ${gagnant.detail ? `<p class="text-xs text-gray-500 italic">${gagnant.detail}</p>` : ''}
            `;
            modal.classList.remove('hidden');
        }

        function fermerRoulette() {
            document.getElementById('roulette-modal').classList.add('hidden');
        }

        init();
    </script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</body>
