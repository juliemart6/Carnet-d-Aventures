<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet d'Aventures 🎒</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appBg: '#FFF9F5', /* Pêche très clair */
                        textMain: '#2D3142', /* Anthracite profond */
                        coral: '#FF7E67', /* Corail dynamique */
                        sun: '#FFC15E', /* Jaune soleil */
                        mint: '#98D7C2', /* Vert menthe doux */
                        ocean: '#7698B3', /* Bleu grisé apaisant */
                        cardBg: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #FFF9F5; }
        .font-display { font-family: 'Fraunces', serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animation des bulles d'icônes */
        .icon-bubble {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 12px; font-size: 16px;
        }
        .bg-icon-soleil { background-color: #FFF3D4; color: #D49B2A; }
        .bg-icon-gris { background-color: #F1F5F9; color: #64748B; }
        .bg-icon-pluie { background-color: #E0F2FE; color: #0284C7; }
        .bg-icon-sport { background-color: #D1FAE5; color: #059669; }
        .bg-icon-detente { background-color: #F3E8FF; color: #9333EA; }
        .bg-icon-culture { background-color: #FFE4E6; color: #E11D48; }
        .bg-icon-epicurien { background-color: #FFEDD5; color: #C2410C; }
    </style>
</head>
<body class="text-textMain pb-24">

    <!-- En-tête Sunset -->
    <header class="bg-gradient-to-br from-coral via-sun to-mint text-white p-8 rounded-b-[2.5rem] shadow-lg mb-8 relative overflow-hidden">
        <div class="relative z-10">
            <h1 class="font-display text-4xl font-bold text-center mb-1 tracking-tight text-textMain">Carnet d'Aventures</h1>
            <p class="text-center text-textMain/80 font-medium">Côte Basque & Alentours</p>
        </div>
        <!-- Déco -->
        <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-white rounded-full opacity-20 blur-2xl"></div>
        <div class="absolute top-0 -left-10 w-24 h-24 bg-white rounded-full opacity-30 blur-xl"></div>
    </header>

    <main class="max-w-3xl mx-auto px-4">

        <!-- Barre de recherche et Hasard -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-sm font-bold uppercase tracking-widest text-ocean">Météo</h2>
            <button onclick="choisirAuHasard()" class="text-sm bg-textMain hover:bg-coral text-white px-5 py-2.5 rounded-2xl font-bold transition-all shadow-md transform hover:-translate-y-0.5">Inspire-moi ✨</button>
        </div>

        <!-- Filtres Météo -->
        <div class="flex gap-3 overflow-x-auto pb-2 mb-6 hide-scroll">
            <button onclick="setFiltre('meteo', 'Toutes')" class="filtre-meteo active shrink-0 px-5 py-2.5 rounded-2xl font-bold text-sm bg-coral text-white shadow-md transition-all transform hover:scale-105">Toutes</button>
            <button onclick="setFiltre('meteo', 'Soleil')" class="filtre-meteo shrink-0 px-5 py-2.5 rounded-2xl font-medium text-sm bg-white text-gray-600 border border-gray-100 shadow-sm transition-all transform hover:scale-105 hover:border-coral">☀️ Soleil</button>
            <button onclick="setFiltre('meteo', 'Gris')" class="filtre-meteo shrink-0 px-5 py-2.5 rounded-2xl font-medium text-sm bg-white text-gray-600 border border-gray-100 shadow-sm transition-all transform hover:scale-105 hover:border-ocean">☁️ Gris</button>
            <button onclick="setFiltre('meteo', 'Pluie')" class="filtre-meteo shrink-0 px-5 py-2.5 rounded-2xl font-medium text-sm bg-white text-gray-600 border border-gray-100 shadow-sm transition-all transform hover:scale-105 hover:border-mint">🌧️ Pluie</button>
        </div>

        <!-- Filtres Type -->
        <h2 class="text-sm font-bold uppercase tracking-widest text-ocean mb-3">Envie du jour</h2>
        <div class="flex gap-3 overflow-x-auto pb-4 mb-6 hide-scroll">
            <button onclick="setFiltre('type', 'Tous')" class="filtre-type active shrink-0 px-5 py-2.5 rounded-2xl font-bold text-sm bg-ocean text-white shadow-md transition-all transform hover:scale-105">Toutes</button>
            <button onclick="setFiltre('type', 'Sport')" class="filtre-type shrink-0 px-5 py-2.5 rounded-2xl font-medium text-sm bg-white text-gray-600 border border-gray-100 shadow-sm transition-all transform hover:scale-105 hover:border-mint">🥾 Sport</button>
            <button onclick="setFiltre('type', 'Détente')" class="filtre-type shrink-0 px-5 py-2.5 rounded-2xl font-medium text-sm bg-white text-gray-600 border border-gray-100 shadow-sm transition-all transform hover:scale-105 hover:border-mint">💆‍♀️ Détente</button>
            <button onclick="setFiltre('type', 'Culture')" class="filtre-type shrink-0 px-5 py-2.5 rounded-2xl font-medium text-sm bg-white text-gray-600 border border-gray-100 shadow-sm transition-all transform hover:scale-105 hover:border-mint">🏛️ Culture</button>
            <button onclick="setFiltre('type', 'Épicurien')" class="filtre-type shrink-0 px-5 py-2.5 rounded-2xl font-medium text-sm bg-white text-gray-600 border border-gray-100 shadow-sm transition-all transform hover:scale-105 hover:border-mint">🍷 Épicurien</button>
        </div>

        <!-- Filtres Statut -->
        <div class="flex bg-white rounded-2xl p-1.5 shadow-sm border border-gray-100 mb-8">
            <button onclick="setFiltre('statut', 'À faire')" id="statut-À faire" class="filtre-statut flex-1 py-3 rounded-xl text-sm font-bold bg-mint text-textMain shadow transition-all">📍 À faire</button>
            <button onclick="setFiltre('statut', 'Fait')" id="statut-Fait" class="filtre-statut flex-1 py-3 rounded-xl text-sm font-medium text-gray-400 hover:text-gray-600 transition-all">✅ Déjà fait</button>
        </div>

        <!-- Grille des aventures -->
        <div id="aventures-container" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Rempli par JS -->
        </div>

    </main>

    <!-- Bouton Flottant Ajouter -->
    <button onclick="document.getElementById('add-modal').showModal()" class="fixed bottom-6 right-6 w-16 h-16 bg-textMain text-white rounded-full shadow-2xl flex items-center justify-center text-3xl hover:bg-coral transition-colors transform hover:-translate-y-1 z-40">
        +
    </button>

    <!-- Modal d'ajout -->
    <dialog id="add-modal" class="backdrop:bg-textMain/40 backdrop:backdrop-blur-sm bg-transparent w-full sm:max-w-md p-4 rounded-3xl m-auto top-1/2 -translate-y-1/2 open:animate-[zoom_0.3s_ease-out]">
        <div class="bg-white w-full rounded-3xl p-6 sm:p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-display text-2xl font-bold text-textMain">Nouvelle Pépite ✨</h3>
                <button onclick="document.getElementById('add-modal').close()" class="text-gray-400 hover:text-coral text-3xl font-bold transition-colors">&times;</button>
            </div>
            
            <form id="add-form" class="space-y-4" onsubmit="ajouterAventure(event)">
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1.5 ml-1">Qu'est-ce qu'on fait ?</label>
                    <input type="text" id="new-titre" required class="w-full bg-appBg border-2 border-transparent focus:border-sun rounded-2xl px-5 py-3.5 outline-none transition-colors font-medium" placeholder="Ex: Sunset à la Chambre d'Amour">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-1.5 ml-1">Où ça ?</label>
                        <input type="text" id="new-lieu" required class="w-full bg-appBg border-2 border-transparent focus:border-sun rounded-2xl px-5 py-3.5 outline-none transition-colors font-medium" placeholder="Ex: Anglet">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-1.5 ml-1">Quand ?</label>
                        <select id="new-meteo" class="w-full bg-appBg border-2 border-transparent focus:border-sun rounded-2xl px-5 py-3.5 outline-none transition-colors font-medium cursor-pointer">
                            <option value="Soleil">☀️ Soleil</option>
                            <option value="Gris">☁️ Grisaille</option>
                            <option value="Pluie">🌧️ Pluie</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1.5 ml-1">C'est plutôt...</label>
                    <select id="new-type" class="w-full bg-appBg border-2 border-transparent focus:border-ocean rounded-2xl px-5 py-3.5 outline-none transition-colors font-medium cursor-pointer">
                        <option value="Sport">🥾 Sport & Effort</option>
                        <option value="Détente">💆‍♀️ Détente & Chill</option>
                        <option value="Culture">🏛️ Culture & Curiosité</option>
                        <option value="Épicurien">🍷 Très gourmand</option>
                    </select>
                </div>

                <!-- LE NOUVEAU CHAMP DÉTAIL -->
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1.5 ml-1">Un petit détail ? (Optionnel)</label>
                    <textarea id="new-detail" rows="2" class="w-full bg-appBg border-2 border-transparent focus:border-mint rounded-2xl px-5 py-3.5 outline-none transition-colors font-medium text-sm" placeholder="Ex: Penser à prendre de l'eau, réserver à l'avance..."></textarea>
                </div>

                <button type="submit" class="w-full bg-textMain hover:bg-coral text-white font-bold text-lg py-4 rounded-2xl mt-4 transition-colors shadow-md">Enregistrer la pépite</button>
            </form>
        </div>
    </dialog>

    <!-- Modal Résultat Aléatoire -->
    <dialog id="random-modal" class="backdrop:bg-textMain/60 backdrop:backdrop-blur-md bg-transparent w-full sm:max-w-sm p-4 rounded-3xl m-auto top-1/2 -translate-y-1/2">
        <div class="bg-white w-full rounded-3xl p-8 shadow-2xl text-center relative overflow-hidden">
            <!-- Particules de fond -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-sun rounded-full opacity-20 blur-2xl"></div>
            
            <h3 class="text-sm font-bold uppercase tracking-widest text-coral mb-2">Le sort a parlé !</h3>
            <p id="random-titre" class="font-display text-3xl font-bold text-textMain mb-3 leading-tight">Titre</p>
            <div class="inline-block bg-appBg text-ocean px-4 py-2 rounded-full font-bold text-sm mb-4">
                📍 <span id="random-lieu">Lieu</span>
            </div>
            
            <!-- LE DÉTAIL DANS LE HASARD -->
            <p id="random-detail" class="text-sm text-gray-500 mb-8 italic px-4">Détail de l'activité...</p>
            
            <button onclick="document.getElementById('random-modal').close()" class="w-full bg-sun text-orange-800 hover:bg-orange-400 hover:text-white font-bold text-lg py-4 rounded-2xl transition-colors">C'est parti !</button>
        </div>
    </dialog>

            // CULTURE
            { id: 31, titre: "Aquarium", lieu: "Biarritz", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Les requins, les raies et les phoques pour une belle aprem pluvieuse." },
            { id: 32, titre: "Cité de l'Océan", lieu: "Biarritz", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Découvrir l'océan de façon ludique avec des animations et casques 3D." },
            { id: 33, titre: "Musée Basque", lieu: "Bayonne", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Plonger dans l'histoire, la pelote et les traditions de la région." },
            { id: 34, titre: "Cathédrale & Cloître", lieu: "Bayonne", meteo: "Gris", type: "Culture", statut: "À faire", detail: "Admirer la majestueuse cathédrale gothique et son cloître calme." },
            { id: 35, titre: "Citadelle Historique", lieu: "St-Jean-Pied-de-Port", meteo: "Soleil", type: "Culture", statut: "À faire", detail: "Se balader dans cette jolie cité fortifiée sur le chemin de Compostelle." },
            { id: 36, titre: "Exploration Grottes", lieu: "Sare", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Visite mystérieuse sous terre, ambiance fraîche (prendre un pull)." },
            { id: 37, titre: "Château d'Abbadia", lieu: "Hendaye", meteo: "Gris", type: "Culture", statut: "À faire", detail: "Un château observatoire fou face à la mer avec une architecture fascinante." },
            { id: 38, titre: "Match Aviron", lieu: "Stade Jean Dauger", meteo: "Soleil", type: "Culture", statut: "À faire", detail: "L'ambiance incroyable et festive avec le fameux hymne de la Peña Baiona." },
            { id: 39, titre: "Match BO", lieu: "Biarritz", meteo: "Gris", type: "Culture", statut: "À faire", detail: "Aller supporter l'équipe de rugby mythique d'Aguilera." },
            { id: 40, titre: "Tournée des Galeries", lieu: "Biarritz", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Un petit tour des galeries d'art contemporain du centre-ville." },
            { id: 62, titre: "Musée Guggenheim", lieu: "Bilbao", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Le chef-d'œuvre de titane et ses expos géantes. Parfait pour une escapade." },
            { id: 63, titre: "Grotte de la Verna", lieu: "Sainte-Engrâce", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Explorer l'une des plus grandes et impressionnantes salles souterraines au monde." },
            { id: 64, titre: "Balade Vieille Ville", lieu: "San Sebastián", meteo: "Soleil", type: "Culture", statut: "À faire", detail: "Flânerie dans les ruelles historiques, jusqu'au port et la plage de la Concha." },
            { id: 65, titre: "Ascension du Phare", lieu: "Biarritz", meteo: "Gris", type: "Culture", statut: "À faire", detail: "Grimper les 248 marches pour une vue à couper le souffle sur le BAB." },
            { id: 66, titre: "Prieuré de Lahonce", lieu: "Lahonce", meteo: "Gris", type: "Culture", statut: "À faire", detail: "Découvrir cette très belle et ancienne abbaye au calme absolu." },
            { id: 67, titre: "Atelier d'Espadrilles", lieu: "Mauléon", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Voir comment sont cousues à la main les vraies espadrilles basques." },
            { id: 68, titre: "Château d'Urtubie", lieu: "Urrugne", meteo: "Soleil", type: "Culture", statut: "À faire", detail: "Un très beau château basque meublé et ses grands jardins." },
            { id: 69, titre: "Expo d'art au Didam", lieu: "Bayonne", meteo: "Pluie", type: "Culture", statut: "À faire", detail: "Découvrir une belle exposition photo ou contemporaine sur les quais." }
        ];

        let aventures = [];
        let filtres = { meteo: 'Toutes', type: 'Tous', statut: 'À faire' };

        function init() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                aventures = JSON.parse(saved);
            } else {
                aventures = [...baseAventures];
                sauvegarder();
            }
            render();
        }

        function sauvegarder() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(aventures));
        }

        function setFiltre(categorie, valeur) {
            filtres[categorie] = valeur;
            
            if(categorie === 'meteo') {
                document.querySelectorAll('.filtre-meteo').forEach(btn => {
                    const isActive = btn.innerText.includes(valeur) || (valeur === 'Toutes' && btn.innerText.includes('Toutes'));
                    btn.className = isActive 
                        ? `filtre-meteo active shrink-0 px-5 py-2.5 rounded-2xl font-bold text-sm bg-coral text-white shadow-md transition-all transform hover:scale-105`
                        : `filtre-meteo shrink-0 px-5 py-2.5 rounded-2xl font-medium text-sm bg-white text-gray-600 border border-gray-100 shadow-sm transition-all transform hover:scale-105 hover:border-coral`;
                });
            } else if (categorie === 'type') {
                document.querySelectorAll('.filtre-type').forEach(btn => {
                    const isActive = btn.innerText.includes(valeur) || (valeur === 'Tous' && btn.innerText.includes('Toutes'));
                    btn.className = isActive 
                        ? `filtre-type active shrink-0 px-5 py-2.5 rounded-2xl font-bold text-sm bg-ocean text-white shadow-md transition-all transform hover:scale-105`
                        : `filtre-type shrink-0 px-5 py-2.5 rounded-2xl font-medium text-sm bg-white text-gray-600 border border-gray-100 shadow-sm transition-all transform hover:scale-105 hover:border-mint`;
                });
            } else if (categorie === 'statut') {
                document.querySelectorAll('.filtre-statut').forEach(btn => {
                    btn.className = "filtre-statut flex-1 py-3 rounded-xl text-sm font-medium text-gray-400 hover:text-gray-600 transition-all";
                });
                const btnActive = document.getElementById(`statut-${valeur}`);
                btnActive.className = "filtre-statut flex-1 py-3 rounded-xl text-sm font-bold bg-mint text-textMain shadow transition-all";
            }
            render();
        }

        function getIconMeteoClass(m) { return m==='Soleil'?'bg-icon-soleil':m==='Pluie'?'bg-icon-pluie':'bg-icon-gris'; }
        function getIconMeteo(m) { return m==='Soleil'?'☀️':m==='Pluie'?'🌧️':'☁️'; }
        
        function getIconTypeClass(t) { return t==='Sport'?'bg-icon-sport':t==='Détente'?'bg-icon-detente':t==='Culture'?'bg-icon-culture':'bg-icon-epicurien'; }
        function getIconType(t) { return t==='Sport'?'🥾':t==='Détente'?'💆‍♀️':t==='Culture'?'🏛️':'🍷'; }

        function render() {
            const container = document.getElementById('aventures-container');
            container.innerHTML = '';

            const filtered = aventures.filter(a => {
                const matchMeteo = filtres.meteo === 'Toutes' || a.meteo === filtres.meteo;
                const matchType = filtres.type === 'Tous' || a.type === filtres.type;
                const matchStatut = a.statut === filtres.statut;
                return matchMeteo && matchType && matchStatut;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center p-12 bg-white rounded-3xl shadow-sm border border-gray-100 mt-4">
                    <span class="text-5xl block mb-4">📭</span>
                    <p class="text-gray-500 font-medium text-lg">Plus aucune idée pour ces critères !</p>
                </div>`;
                return;
            }

            filtered.forEach(a => {
                const card = document.createElement('div');
                card.className = "aventure-card bg-white rounded-3xl p-6 shadow-sm border-2 border-transparent relative group transition-all duration-300 hover:shadow-xl hover:-translate-y-1 flex flex-col justify-between h-full cursor-default";
                
                let actionBtn = a.statut === 'À faire' 
                    ? `<button onclick="toggleStatut(${a.id})" class="mt-4 w-full py-3 bg-appBg text-textMain font-bold text-sm rounded-2xl hover:bg-mint transition-colors group-hover:shadow-sm">Cocher comme fait ! ✨</button>`
                    : `<button onclick="toggleStatut(${a.id})" class="mt-4 w-full py-3 bg-gray-50 text-gray-400 font-bold text-sm rounded-2xl hover:bg-gray-100 transition-colors">Remettre dans la liste ↺</button>`;

                card.innerHTML = `
                    <button onclick="supprimerAventure(${a.id})" class="absolute top-4 right-4 text-gray-200 hover:text-coral opacity-0 group-hover:opacity-100 transition-opacity bg-white rounded-full p-1 shadow-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                    <div>
                        <div class="flex items-center gap-2 mb-4">
                            <span class="text-xs font-bold uppercase tracking-wider text-ocean bg-appBg px-3 py-1.5 rounded-full border border-ocean/10">📍 ${a.lieu}</span>
                            <span class="icon-bubble ${getIconMeteoClass(a.meteo)}" title="Météo">${getIconMeteo(a.meteo)}</span>
                            <span class="icon-bubble ${getIconTypeClass(a.type)}" title="Catégorie">${getIconType(a.type)}</span>
                        </div>
                        <h3 class="font-display text-2xl font-bold text-textMain leading-tight pr-4 mb-2">${a.titre}</h3>
                        ${a.detail ? `<p class="text-sm text-gray-500 leading-snug line-clamp-2 mb-2">${a.detail}</p>` : ''}
                    </div>
                    ${actionBtn}
                `;
                container.appendChild(card);
            });
        }

        function toggleStatut(id) {
            const index = aventures.findIndex(a => a.id === id);
            if(index > -1) {
                aventures[index].statut = aventures[index].statut === 'À faire' ? 'Fait' : 'À faire';
                sauvegarder();
                render();
            }
        }

        function supprimerAventure(id) {
            if(confirm("Retirer cette idée du carnet ?")) {
                aventures = aventures.filter(a => a.id !== id);
                sauvegarder();
                render();
            }
        }

        function ajouterAventure(e) {
            e.preventDefault();
            const titre = document.getElementById('new-titre').value;
            const lieu = document.getElementById('new-lieu').value;
            const meteo = document.getElementById('new-meteo').value;
            const type = document.getElementById('new-type').value;
            const detail = document.getElementById('new-detail').value;

            aventures.unshift({
                id: Date.now(),
                titre, lieu, meteo, type, detail, statut: 'À faire'
            });

            sauvegarder();
            document.getElementById('add-form').reset();
            document.getElementById('add-modal').close();
            setFiltre('statut', 'À faire');
        }

        function choisirAuHasard() {
            const possibles = aventures.filter(a => {
                const matchMeteo = filtres.meteo === 'Toutes' || a.meteo === filtres.meteo;
                const matchType = filtres.type === 'Tous' || a.type === filtres.type;
                const matchStatut = a.statut === 'À faire'; // On ne tire au sort que ce qui est à faire !
                return matchMeteo && matchType && matchStatut;
            });

            if(possibles.length === 0) {
                alert("Oups ! Il n'y a plus aucune activité 'À faire' pour ces filtres.");
                return;
            }

            const btn = document.querySelector('button[onclick="choisirAuHasard()"]');
            btn.innerHTML = "Hmm... 🤔";
            btn.classList.add('opacity-50');
            btn.disabled = true;

            const cards = document.querySelectorAll('.aventure-card');
            let tours = 0;
            const maxTours = 12;
            
            const interval = setInterval(() => {
                cards.forEach(c => {
                    c.style.borderColor = 'transparent';
                    c.style.transform = 'translateY(0)';
                });
                
                if(cards.length > 0) {
                    const randomCard = cards[Math.floor(Math.random() * cards.length)];
                    randomCard.style.borderColor = '#FFC15E'; // border-sun
                    randomCard.style.transform = 'translateY(-4px)';
                }

                tours++;
                if (tours >= maxTours) {
                    clearInterval(interval);
                    
                    setTimeout(() => {
                        cards.forEach(c => {
                            c.style.borderColor = 'transparent';
                            c.style.transform = 'translateY(0)';
                        });
                        
                        const gagnant = possibles[Math.floor(Math.random() * possibles.length)];
                        
                        btn.innerHTML = "Inspire-moi ✨";
                        btn.disabled = false;
                        btn.classList.remove('opacity-50');
                        
                        document.getElementById('random-titre').innerText = gagnant.titre;
                        document.getElementById('random-lieu').innerText = gagnant.lieu;
                        document.getElementById('random-detail').innerText = gagnant.detail || 'Pas de détail spécifique.';
                        document.getElementById('random-detail').style.display = 'block';
                        document.getElementById('random-modal').showModal();
                    }, 300);
                }
            }, 120);
        }

        init();
    </script>
</body>
</html>
